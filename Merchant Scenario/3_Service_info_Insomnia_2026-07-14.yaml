        name: Get service info Message Type SO
        meta:
          id: req_003d24a9b73d4e62b1723a7ec82269d9
          created: 1745935222490
          modified: 1779822241340
          isPrivate: false
          description: >-
            <b><i>What it does</i></b>


            <h7>The Service Information API enables ecommerce platforms to
            inform merchant customers about scheduled outages to web
            services.</h7>


            <b><i>How it works</i></b>


            <h7>A request to this service returns dates and times of upcoming
            service outages and a prepared message you can display to your
            merchants. This helps merchants plan and mitigate the impact of web
            service unavailability.</h7>
          sortKey: -1744819175602
        method: GET
        headers:
          - name: User-Agent
            value: insomnia/11.0.2
          - name: Authorization
            value: Bearer {{ _.accessToken }}
            description: ""
            disabled: false
          - name: Accept
            value: application/json
            description: ""
            disabled: false
          - name: Accept-Language
            value: en-CA
            description: ""
            disabled: false
        settings:
          renderRequestBody: true
          encodeUrl: true
          followRedirects: global
          cookies:
            send: true
            store: true
          rebuildPath: true
