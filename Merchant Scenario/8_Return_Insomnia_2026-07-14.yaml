    children:
      - name: GetAuthorizedReturn
        meta:
          id: fld_fa9f32701eed40f8953e1f27b0d25bf7
          created: 1744727981658
          modified: 1744728025020
          sortKey: -1744727981658
          description: ""
        children:
          - url: "{{ _.base_url }}/returns/v1/{{ _.mailby }}/{{ _.mobo
              }}/authorized-returns"
            name: CreateAuthorizedReturn
            meta:
              id: req_bcb5c22dc8f947418ef27c644cf0c9f8
              created: 1743605848870
              modified: 1773518664521
              isPrivate: false
              description: >-
                <table border="1" cellpadding="6" cellspacing="0"
                style="border-collapse: collapse; width: 100%; font-family:
                Arial, sans-serif;">
                  <thead>
                    <tr>
                      <th style="width: 20%;">Element Name</th>
                      <th style="width: 15%;">Type</th>
                      <th style="width: 20%;">Required / Optional</th>
                      <th>Description</th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr>
                      <td>createPublicKey</td>
                      <td>boolean</td>
                      <td>Optional</td>
                      <td>{true}<br>If set to "true", generates a public URL for the PDF label and includes the link with expiry date in the response. Useful for QR code generation and sharing labels digitally. <br><strong>Note:</strong> 'retail-only = true' overrides this flag. These flags are mutually exclusive.</td>
                    </tr>
                    <tr>
                      <td>createQrCode</td>
                      <td>boolean</td>
                      <td>Optional</td>
                      <td>(true|false)<br>Must be used with <code>createPublicKey=true</code>. Automatically returns the QR code of the public URL.</td>
                    </tr>
                    <tr>
                      <td>boxFree</td>
                      <td>boolean</td>
                      <td>Optional</td>
                      <td>(true|false)<br>Adds "Box-free / Sans emballage" messaging and green QR code. Eligibility rules apply.</td>
                    </tr>
                		    <tr>
                      <td>retailOnly</td>
                      <td>boolean</td>
                      <td>Optional</td>
                      <td>{true}<br>
                if flag is present and set to 'true', service will not return an
                artifact link.


                Note:


                If ‘retailOnly’ flag is present, it will always be true.

                If ‘retailOnly’ flag is not present, pdf label will be given
                when 2D barcode is scanned by a customer.

                ‘retailOnly = true’ will always take precedence over
                ‘createPublicKey’, they both are mutually exclusive.</td>
                    </tr>
                    <tr>
                      <td>customerBarcode</td>
                      <td>string</td>
                      <td>Optional</td>
                      <td>(16 alphanumeric)<br>Value to be rendered in the customer info section of the return label.</td>
                    </tr>
                    <tr>
                      <td>customerBarcodeType</td>
                      <td>string</td>
                      <td>Optional</td>
                      <td>(LINEAR | 2D)<br>Type of the barcode. Required if <code>customerBarcode</code> is provided.</td>
                    </tr>
                    <tr>
                      <td>serviceCode</td>
                      <td>string</td>
                      <td>Required</td>
                      <td>Occurs 1-20 times. If omitted, all applicable services are returned.<br><br>
                        <table border="1" cellpadding="4" cellspacing="0" style="border-collapse: collapse; width: 100%;">
                          <thead>
                            <tr>
                              <th>Service Code</th>
                              <th>Description</th>
                            </tr>
                          </thead>
                          <tbody>
                            <tr><td>DOM.RP</td><td>Regular Parcel</td></tr>
                            <tr><td>DOM.EP</td><td>Expedited Parcel</td></tr>
                            <tr><td>DOM.XP</td><td>Xpresspost</td></tr>
                            <tr><td>DOM.PC</td><td>Priority</td></tr>
                          </tbody>
                        </table>
                      </td>
                    </tr>
                    <tr><td>returner</td><td>object</td><td>Required</td><td>Contains sender info that will appear in the "From" address of the label. Empty fields are removed when formatting.</td></tr>
                    <tr><td>name</td><td>string</td><td>Required</td><td>(44 alphanumeric) Contact name of the returner.</td></tr>
                    <tr><td>company</td><td>string</td><td>Optional</td><td>(44 alphanumeric) Company name of the returner.</td></tr>
                    <tr><td>domesticAddress</td><td>object</td><td>Required</td><td>Address information for the returner. Blank fields are removed in final formatting.</td></tr>
                    <tr><td>addressLine1</td><td>string</td><td>Required</td><td>(44 alphanumeric)</td></tr>
                    <tr><td>City</td><td>string</td><td>Required</td><td>(40 alphanumeric)</td></tr>
                    <tr><td>province</td><td>string</td><td>Required</td><td>(2 characters)</td></tr>
                    <tr><td>postalCode</td><td>string</td><td>Required</td><td>(A9A9A9 format)</td></tr>
                    <tr><td>receiver</td><td>object</td><td>Required</td><td>Receiver's destination info. Blank fields removed in label formatting.</td></tr>
                    <tr><td>name</td><td>string</td><td>Required</td><td>(44 alphanumeric) Contact name of receiver.</td></tr>
                    <tr><td>company</td><td>string</td><td>Optional</td><td>(44 alphanumeric) Company name of receiver.</td></tr>
                    <tr><td>email</td><td>string</td><td>Optional</td><td>(60 chars, valid email) Reserved for future use.</td></tr>
                    <tr><td>receiverVoiceNumber</td><td>string</td><td>Optional</td><td>(up to 25 characters) Receiver phone number. Will not appear on label.</td></tr>
                    <tr><td>domesticAddress</td><td>object</td><td>Required</td><td>Receiver address. Required if receiver exists. Blank fields are removed for label formatting.</td></tr>
                    <tr><td>addressLine1</td><td>string</td><td>Required</td><td>(44 alphanumeric)</td></tr>
                    <tr><td>City</td><td>string</td><td>Required</td><td>(40 alphanumeric)</td></tr>
                    <tr><td>province</td><td>string</td><td>Required</td><td>(2 characters)</td></tr>
                    <tr><td>postalCode</td><td>string</td><td>Required</td><td>(A9A9A9 format)</td></tr>
                    <tr><td>parcelCharacteristics</td><td>object</td><td>Optional</td><td>Information about the physical characteristics of the parcel.</td></tr>
                    <tr><td>weight</td><td>number</td><td>Optional</td><td>(Pattern 3.3 e.g. 999.999) Total package weight in kg.</td></tr>
                    <tr><td>dimensions</td><td>object</td><td>Optional</td><td>Parcel dimension information (cm).</td></tr>
                    <tr><td>length</td><td>number</td><td>Conditionally Required</td><td>(Pattern 3.1 e.g. 999.9) Required if <code>dimensions</code> exists. Improves pricing accuracy.</td></tr>
                    <tr><td>width</td><td>number</td><td>Conditionally Required</td><td>Same rules as <code>length</code>. Width of the parcel in cm.</td></tr>
                    <tr><td>height</td><td>number</td><td>Conditionally Required</td><td>Same rules as <code>length</code>. Height of the parcel in cm.</td></tr>
                    <tr><td>printPreferences</td><td>object</td><td>Optional</td><td>Print preferences for return labels.</td></tr>
                    <tr><td>outputFormat</td><td>string</td><td>Optional</td><td>(7 alphanumeric) Valid: <code>8.5x11</code>, <code>4x6</code>. Defaults to <code>8.5x11</code>.</td></tr>
                    <tr><td>encoding</td><td>string</td><td>Optional</td><td>{PDF, ZPL}<br>Defines output format. If ZPL, returned data contains ZPL II printer commands. Used with thermal printers.</td></tr>
                    <tr><td>showPackingInstructions</td><td>boolean</td><td>Optional</td><td>{true, false} Defaults to true. Indicates whether packing instructions should appear on label.</td></tr>
                    <tr><td>settlementInfo</td><td>object</td><td>Optional</td><td>Analogous to Create Shipment. Optional and generally omitted.</td></tr>
                    <tr><td>paidByCustomer</td><td>string</td><td>Optional</td><td>(10-digit numeric) Reserved for future use.</td></tr>
                    <tr><td>contractId</td><td>string</td><td>Optional</td><td>(10-digit numeric) Reserved for future use.</td></tr>
                    <tr><td>references</td><td>object</td><td>Optional</td><td>User-defined reference values for tracking or internal use.</td></tr>
                    <tr><td>customerRef1</td><td>string</td><td>Optional</td><td>(Up to 35 characters) Appears on label and in tracking files.</td></tr>
                    <tr><td>customerRef2</td><td>string</td><td>Optional</td><td>Same as <code>customerRef1</code>. Used as a second reference field.</td></tr>
                    <tr><td>notifications</td><td>object</td><td>Optional</td><td>Holds email notification settings.</td></tr>
                    <tr><td>notification</td><td>object</td><td>Mandatory</td><td>Required if <code>notifications</code> is present. Up to 4 allowed. Each holds one email + notification types.</td></tr>
                    <tr><td>email</td><td>string</td><td>Mandatory</td><td>(Up to 60 chars) Email for tracking updates. Must be valid.</td></tr>
                    <tr><td>onShipment</td><td>boolean</td><td>Mandatory</td><td>{true, false} Required with <code>notification</code>. Enables shipment updates.</td></tr>
                    <tr><td>onException</td><td>boolean</td><td>Mandatory</td><td>{true, false} Enables exception-related updates.</td></tr>
                    <tr><td>onDelivery</td><td>boolean</td><td>Mandatory</td><td>{true, false} Enables delivery updates.</td></tr>
                    <tr><td>emailSubject</td><td>string</td><td>Optional</td><td>{tracking, customer-ref-1, customer-ref-2}<br>Subject line values:<ul><li>Ship Notification for Item</li><li>Exception Notification for Item</li><li>Delivery Notification for Item</li></ul>Defaults to "TRACKING" with tracking number.</td></tr>
                  </tbody>
                </table>
              sortKey: -1744727995585
            method: POST
            body:
              mimeType: application/json
              text: |-
                {
                	"customerBarcode": "1234567890",
                	"customerBarcodeType": "2D",
                	"serviceCode": "DOM.XP",
                	"returner": {
                		"name": "Bulma",
                		"company": "Capsule Corp.",
                		"domesticAddress": {
                			"addressLine1": "502 MAIN ST N",
                			"city": "MONTREAL",
                			"province": "QC",
                			"postalCode": "H2B1A0"
                		}
                	},
