                artifact link.


                Note:


                If ‘retailOnly’ flag is present, it will always be true.

                If ‘retailOnly’ flag is not present, pdf label will be given
                when 2D barcode is scanned by a customer.

                ‘retailOnly = true’ will always take precedence over
                ‘createPublicKey’, they both are mutually exclusive.</td>
                    </tr>
                    <tr>
                      <td>customerBarcode</td>
                      <td>string</td>
                      <td>Optional</td>
                      <td>(16 alphanumeric)<br>Value to be rendered in the customer info section of the return label.</td>
