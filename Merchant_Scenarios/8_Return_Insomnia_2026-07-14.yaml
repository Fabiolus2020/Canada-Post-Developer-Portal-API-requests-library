                            <tr><td>DOM.EP</td><td>Expedited Parcel</td></tr>
                            <tr><td>DOM.XP</td><td>Xpresspost</td></tr>
                            <tr><td>DOM.PC</td><td>Priority</td></tr>
                          </tbody>
                        </table>
                      </td>
                    </tr>
                    <tr><td>returner</td><td>object</td><td>Required</td><td>Contains sender info that will appear in the "From" address of the label. Empty fields are removed when formatting.</td></tr>
                    <tr><td>name</td><td>string</td><td>Required</td><td>(44 alphanumeric) Contact name of the returner.</td></tr>
                    <tr><td>company</td><td>string</td><td>Optional</td><td>(44 alphanumeric) Company name of the returner.</td></tr>
                    <tr><td>domesticAddress</td><td>object</td><td>Required</td><td>Address information for the returner. Blank fields are removed in final formatting.</td></tr>
                    <tr><td>addressLine1</td><td>string</td><td>Required</td><td>(44 alphanumeric)</td></tr>
                    <tr><td>City</td><td>string</td><td>Required</td><td>(40 alphanumeric)</td></tr>
