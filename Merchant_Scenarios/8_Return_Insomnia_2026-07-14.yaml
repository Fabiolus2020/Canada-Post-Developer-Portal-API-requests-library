                      <th style="width: 15%;">Type</th>
                      <th style="width: 20%;">Required / Optional</th>
                      <th>Description</th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr>
                      <td>createPublicKey</td>
                      <td>boolean</td>
                      <td>Optional</td>
                      <td>{true}<br>If set to "true", generates a public URL for the PDF label and includes the link with expiry date in the response. Useful for QR code generation and sharing labels digitally. <br><strong>Note:</strong> 'retail-only = true' overrides this flag. These flags are mutually exclusive.</td>
                    </tr>
                    <tr>
                      <td>createQrCode</td>
                      <td>boolean</td>
                      <td>Optional</td>
                      <td>(true|false)<br>Must be used with <code>createPublicKey=true</code>. Automatically returns the QR code of the public URL.</td>
                    </tr>
                    <tr>
                      <td>boxFree</td>
                      <td>boolean</td>
                      <td>Optional</td>
                      <td>(true|false)<br>Adds "Box-free / Sans emballage" messaging and green QR code. Eligibility rules apply.</td>
                    </tr>
                				    <tr>
                      <td>retailOnly</td>
                      <td>boolean</td>
                      <td>Optional</td>
                      <td>{true}<br>
                if flag is present and set to 'true', service will not return an
                artifact link.


                Note:


                If ‘retailOnly’ flag is present, it will always be true.

                If ‘retailOnly’ flag is not present, pdf label will be given
                when 2D barcode is scanned by a customer.

                ‘retailOnly = true’ will always take precedence over
                ‘createPublicKey’, they both are mutually exclusive.</td>
                    </tr>
                    <tr>
                      <td>customerBarcode</td>
                      <td>string</td>
                      <td>Optional</td>
                      <td>(16 alphanumeric)<br>Value to be rendered in the customer info section of the return label.</td>
                    </tr>
                    <tr>
                      <td>customerBarcodeType</td>
                      <td>string</td>
                      <td>Optional</td>
                      <td>(LINEAR | 2D)<br>Type of the barcode. Required if <code>customerBarcode</code> is provided.</td>
                    </tr>
                    <tr>
                      <td>serviceCode</td>
                      <td>string</td>
                      <td>Required</td>
                      <td>Occurs 1-20 times. If omitted, all applicable services are returned.<br><br>
                        <table border="1" cellpadding="4" cellspacing="0" style="border-collapse: collapse; width: 100%;">
                          <thead>
                            <tr>
                              <th>Service Code</th>
                              <th>Description</th>
                            </tr>
                          </thead>
                          <tbody>
