          - url: "{{ _.base_url }}/returns/v1/{{ _.mailby }}-{{ _['platform-id'] }}/{{
              _.mobo }}/open-returns/887051748430546292/details"
            name: Get Open Return Template Details
            meta:
              id: req_07d9a0988d474a898bcd7f769c391f93
              created: 1744818580512
              modified: 1775671378131
              isPrivate: false
              description: >
                <div>
                  <p>
                Used to retrieve the information you originally provided when
                you called Create Open Return Template to create the template
                (e.g. the number of labels you specified for this template; the
                receiver). This call also provides the number of remaining
                labels for this template.

                </div>
                  </p>

                <br />

                <table border="1" cellpadding="10" cellspacing="0"
                style="border-collapse: separate; border-spacing: 0 10px; width:
                100%;">
                  <thead>
                    <tr>
                      <th style="width: 20%;">Element Name</th>
                      <th style="width: 15%;">Type</th>
                      <th style="width: 20%;">Required / Optional</th>
                      <th>Description</th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr>
                      <td><p>maxNumberOfArtifacts</p></td>
                      <td><p>integer</p></td>
                      <td><p>Required</p></td>
                      <td>
                        <p>Maximum number of return labels that can be generated and retrieved using the template.</p>
                        <p>Must be a numeric value between 1 and 100,000.</p>
                      </td>
                    </tr>
                    <tr>
                      <td><p>serviceCode</p></td>
                      <td><p>string</p></td>
                      <td><p>Required</p></td>
                      <td>
                        <p>32-character alphanumeric. Used for domestic returns only.</p>
                        <ul>
                          <li>DOM.RP – Regular Parcel</li>
                          <li>DOM.EP – Expedited Parcel</li>
                          <li>DOM.XP – Xpresspost</li>
                          <li>DOM.PC – Priority</li>
                        </ul>
                      </td>
                    </tr>
                    <tr>
                      <td><p>receiver</p></td>
                      <td><p>object</p></td>
                      <td><p>Required</p></td>
                      <td>
                        <p>Information for the "To" address. Blank fields are omitted during label formatting.</p>
                      </td>
                    </tr>
                    <tr>
                      <td><p>name</p></td>
                      <td><p>string</p></td>
                      <td><p>Required</p></td>
                      <td><p>Receiver’s name (up to 44 characters).</p></td>
                    </tr>
                    <tr>
                      <td><p>company</p></td>
                      <td><p>string</p></td>
                      <td><p>Optional</p></td>
                      <td><p>Company name of the receiver (up to 44 characters).</p></td>
                    </tr>
                    <tr>
                      <td><p>domesticAddress</p></td>
                      <td><p>object</p></td>
                      <td><p>Required</p></td>
                      <td><p>Receiver's address details. Blank fields are removed during formatting.</p></td>
                    </tr>
                    <tr>
                      <td><p>addressLine1</p></td>
                      <td><p>string</p></td>
                      <td><p>Required</p></td>
                      <td><p>Main street address of the receiver (up to 44 characters).</p></td>
                    </tr>
                    <tr>
                      <td><p>addressLine2</p></td>
                      <td><p>string</p></td>
                      <td><p>Optional</p></td>
                      <td><p>Additional address information (up to 44 characters).</p></td>
                    </tr>
                    <tr>
                      <td><p>city</p></td>
                      <td><p>string</p></td>
                      <td><p>Required</p></td>
                      <td><p>City of the receiver (up to 40 characters).</p></td>
                    </tr>
                    <tr>
                      <td><p>province</p></td>
                      <td><p>string</p></td>
                      <td><p>Required</p></td>
                      <td><p>2-character province code of the receiver.</p></td>
                    </tr>
                    <tr>
                      <td><p>postalCode</p></td>
                      <td><p>string</p></td>
                      <td><p>Required</p></td>
                      <td><p>Receiver's postal code in Canadian format (A9A9A9).</p></td>
                    </tr>
                    <tr>
                      <td><p>printPreferences</p></td>
                      <td><p>object</p></td>
                      <td><p>Optional</p></td>
                      <td><p>Preferences for label printing.</p></td>
                    </tr>
                    <tr>
                      <td><p>outputFormat</p></td>
                      <td><p>string</p></td>
                      <td><p>Optional</p></td>
                      <td><p>Values: <code>8.5x11</code> (default), <code>4x6</code>. The <code>3x5</code> format is deprecated and converted to 4x6.</p></td>
                    </tr>
                    <tr>
                      <td><p>customerInputType</p></td>
                      <td><p>string</p></td>
                      <td><p>Optional</p></td>
                      <td>
                        <p>Used to print a data entry field for customers on the label. Applies to 4x6 and 8.5x11.</p>
                        <ul>
                          <li>INVOICE – Invoice No</li>
                          <li>ITEM – Item No</li>
                          <li>ORDER – Order No</li>
                          <li>PART – Part No</li>
                          <li>PO – Purchase Order No</li>
                          <li>RETURN – Return No</li>
                          <li>RSA – Return Service Authorization No</li>
                          <li>SERIAL – Serial No</li>
                          <li>SKU – SKU No</li>
                        </ul>
                      </td>
                    </tr>
                    <tr>
                      <td><p>encoding</p></td>
                      <td><p>string</p></td>
                      <td><p>Optional</p></td>
                      <td><p>Values: <code>PDF</code> (default), <code>ZPL</code>. ZPL requires thermal paper and supports truncation.</p></td>
                    </tr>
                    <tr>
                      <td><p>showPackingInstructions</p></td>
                      <td><p>boolean</p></td>
                      <td><p>Optional</p></td>
                      <td><p>Whether to display packing instructions. Defaults to <code>false</code>.</p></td>
                    </tr>
                    <tr>
                      <td><p>settlementInfo</p></td>
                      <td><p>object</p></td>
                      <td><p>Required</p></td>
                      <td><p>Contains your commercial contract number for verification.</p></td>
                    </tr>
                    <tr>
                      <td><p>contractId</p></td>
                      <td><p>string</p></td>
                      <td><p>Required</p></td>
                      <td><p>10-digit numeric. Required for Open Returns service. Only available to commercial customers with a volume agreement.</p></td>
                    </tr>
                  </tbody>
                </table>
              sortKey: -1744819001222
            method: GET
            body:
              mimeType: application/json
