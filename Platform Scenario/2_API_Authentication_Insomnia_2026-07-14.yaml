    children:
      - url: "{{ _.base_url }}/cpc-api-native-oauth-provider/oauth2/token"
        name: "API Authentication "
        meta:
          id: req_488a4f202b9c40ac9830f1dfc950e46a
          created: 1708476873148
          modified: 1784048336874
          isPrivate: false
          description: |+
            

            <a href="https://developer-developpeur.canadapost-postescanada.ca/devportal-portaildesdeveloppeurs/authentication-guide">Click here for the Technical reference page</a> 


            <h5>Authentication guide</h5>
            </h1>
            <p class="sub-header">
            Ensure the integrity of our APIs and protect your data from unauthorized use
            </p>
            </div>
            <div class="desc">
            <div class="field field--name-body field--type-text-with-summary field--label-hidden field--item"><p>Our authentication guide helps you use our APIs in the most security way possible. Understand how authentication and authorization protocols protect the integrity of the APIs, and avoid data breaches and other forms of misuse.</p>
            <br>
            <br>
            <p><strong>Key concepts to understanding security in the Developer Portal</strong></p>
            <br>
            <h5>API authentication</h5>
            <br>
            <p>All API operations require an OAuth 2.0 Bearer access token. Under the OAuth 2.0 protocol, you receive an access token when you provide a valid client_id and client_secret to an authorization service along with grant type client_credentials and any optional scope. The access token is then passed in the authorization header for each request.</p>
            <br>
            <h5>Client credentials and the OAuth2 client credentials flow</h5>
            <br>
            <p>Client credentials are based on OAuth 2.0 grant type. The client passes the access token in all resource calls as an HTTP header. The resource validates the token by calling the OAuth provider introspection service and if the token is valid, the resource provider processes the request.</p>
            <br>

            <h5>Apps</h5>
            <br>
            <p>Canada Post uses apps to manage credentials and API subscriptions and to provide access to usage dashboards. An app can have one or more associated credentials. We support machine-to-machine grant type client_credentials.</p>
            <br>
            <h5>Access tokens</h5>
            <br>
            <p>To get an access token, call https://api.canadapost-postescanada.ca/prod/devportal-portaildesdeveloppeurs/cpc-api-native-oauth-provider/oauth2/token service and provide your valid client_id and client_secret along with grant type client_credentials and scope.</p>
            <br>
            <p>The service returns a token with the following two attributes: consented_on and expires_in.</p>
            <br>
            <p>For example:</p>
            <ul><li>
            <p><strong>consented_on: 1698647167</strong></p>
            	<p>Represents the Unix epoch time when token lifetime started.</p>
            	</li>
            	<li>
            	<p><strong>expires_in: 28800</strong></p>
            	<p>Represents the number of seconds before the token expires.</p>
            	</li>
            </ul><p>By knowing both the consented_on and expires_in values, you can estimate the token expiry time. Note that if you do not request a new token before it expires, the token invalidates and returns a 401 Unauthorized code. When the token is returned, include it as Authorization: Bearer header along with other transaction‑specific data in the business service call.</p>
            <br>
            <h5>How to consume services protected by OAuth2 security</h5>
            <br>
            <p>Call token service to get token:</p>
            <br>
            <pre>
            curl -- request POST
            <br>
            -- URL https://&lt;APIGateway&gt;/oauth2/token
            -header 'X-IBM-Client-Id: 368b7f95d5574d85f83bcc04421628de'
            --header 'X-IBM-Client-Secret: 3cb4a38f6598652c726c06a2db513b6d'
            --header 'accept: application/json'
            --data 'scope=merchant&amp;grant_type=client_credentials'</pre>
            <br>
            <p>It returns:</p>
            <br>
            <pre>
            {
            "token_type": "Bearer",
            "access_token": "AAIgMzY4YjdmOTVkNTU3NGQ4NWY4M2JjYzA0NDIxNjI4ZGWk-WzMsbRQYLoT4LAo2h07lNzGUj0SsGlPckaIC9GeiDwa943kykQCOx0wZ5X3hUVmCfGN52IlXNaxpUrPxRFZ7iNVI5SV6FDlO1UjBIqjZ6b8UlSZ_1UVCQpxqGuwn48",
            "scope": "merchant",
            "expires_in": 3600,
            "consented_on": 1698647250
            }
            </pre></div>      
            </div>
            </div>
            </article>
              </div>
             </section>
             </div>
              </div>
            </body>
            </html>


