              created: 1708476872960
              modified: 1708476872960
              sortKey: -1707425916812.7812
              description: >-
                Canada Post offer shipping options. Below are examples for each
                options. For example you can make them available to the end user
                to choose globally for all shipments or via a list where options
                can be picked by the end user.


                Keep in mind that options can be combined for example you could
                have option for Coverage(insurance) and Signature for the same
                shipments therefore it is important to allow selection of
                multiple options per shipments.


                Below are all shipping options available when shipping within
                Canada

                	"option-code": [
                    "SO"				signature option
                    "COD"				Collect On Delivery option
                    "COV"				Insurance option
                    "D2PO"			Delicer To Post Office option
                    "HFP"				Hold For Pickup option
                    "PA21"			Proof Of Age 21 option
                    "PA19"			Proof Of Age 19 option
                    "PA18"			Proof Of Age 18 option
                    "LAD"				Leave At The Door option
                    "DNS"				Do Not Safe Drop option
                	]
