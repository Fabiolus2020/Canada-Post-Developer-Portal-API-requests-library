  - name: Rating API's
    meta:
      id: fld_f3d37234b25c450d91f3c8389faa152f
      created: 1708476873138
      modified: 1770061060837
      sortKey: -1699973212088
      description: ""
    children:
      - url: "{{ _.base_url }}/rating/v1/prices"
        name: GetRates_Canada(One service)
        meta:
          id: req_5fdc056b650245efa39897d88cfd69a5
          created: 1708476873140
          modified: 1779826964769
          isPrivate: false
          description: >-
            <table border="1" cellpadding="10" cellspacing="0"
            style="border-collapse: separate; border-spacing: 0 10px; width:
            100%;">
               <thead>
                  <tr>
                     <th colspan="4">Get Rates – Request Elements</th>
                  </tr>
               </thead>
               <tbody>
                  <tr>
                     <th style="width: 25%;">Element Name</th>
                     <th style="width: 15%;">Type</th>
                     <th style="width: 15%;">Required / Optional</th>
                     <th>Description</th>
                  </tr>
                  <tr>
                     <td>customerNumber</td>
                     <td>Simple</td>
                     <td>Conditionally Required</td>
                     <td>Owner's customer number (up to 10 digits). Needed for commercial rates.</td>
                  </tr>
                  <tr>
                     <td>contractId</td>
                     <td>Simple</td>
                     <td>Conditionally Required</td>
                     <td>Required if <code>customer-number</code> is used. Numeric (up to 10 digits).</td>
                  </tr>
                  <tr>
                     <td>promoCode</td>
                     <td>Simple</td>
                     <td>Optional</td>
                     <td>Promotional discount code.</td>
                  </tr>
                  <tr>
                     <td>quoteType</td>
                     <td>Simple</td>
                     <td>Optional</td>
                     <td>"commercial" (discounted rates) or "counter" (consumer rates). Defaults to "commercial".</td>
                  </tr>
                  <tr>
                     <td>expectedMailingDate</td>
                     <td>Simple</td>
                     <td>Optional</td>
                     <td>Date in <code>YYYY-MM-DD</code> format. Used for expected delivery calculations.</td>
                  </tr>
                  <tr>
                     <td>options</td>
                     <td>Complex</td>
                     <td>Optional</td>
                     <td>Structure containing the list of options desired for the shipment.</td>
                  </tr>
                  <tr>
                     <td>optionCode</td>
                     <td>Simple</td>
                     <td>Required</td>
                     <td>
                        Valid values:         
                        <p>SO - Signature<br>
                           COV - Coverage<br>
                           COD - Collect on delivery<br>
                           PA18 - Proof of Age Required - 18<br>
                           PA19 - Proof of Age Required - 19<br>
                           PA21 - Proof of Age Required - 21<br>
                           HFP - Card for pickup<br>
                           DNS - Do not safe drop<br>
                           LAD - Leave at door - do not card<br>
                           D2PO - Deliver to Post Office
                        </p>
                     </td>
                  </tr>
                  <tr>
                     <td>optionAmount</td>
                     <td>Simple</td>
                     <td>Required (if applicable)</td>
                     <td>For <code>COV</code>, the insured amount (5.2 digits, e.g., 99999.99).</td>
                  </tr>
                  <tr>
                     <td>parcelCharacteristics</td>
                     <td>Complex</td>
                     <td>Required</td>
                     <td>Details of the parcel such as weight, dimensions, and packaging.</td>
                  </tr>
                  <tr>
                     <td>weight</td>
                     <td>Simple</td>
                     <td>Required</td>
                     <td>Parcel weight in kilograms (up to 99.999 kg).</td>
                  </tr>
                  <tr>
                     <td>dimensions</td>
                     <td>Complex</td>
                     <td>Optional</td>
                     <td>Parcel dimensions in cm (length, width, height).</td>
                  </tr>
                  <tr>
                     <td>length</td>
                     <td>Complex</td>
                     <td>Optional</td>
                     <td>Longest dimension. (3.1 digits e.g. 999.9 pattern)</td>
                  </tr>
                  <tr>
                     <td>width</td>
                     <td>Complex</td>
                     <td>Optional</td>
                     <td>Longest dimension. (3.1 digits e.g. 999.9 pattern)</td>
                  </tr>
                  <tr>
                     <td>height</td>
                     <td>Complex</td>
                     <td>Optional</td>
                     <td>Longest dimension. (3.1 digits e.g. 999.9 pattern)</td>
                  </tr>
                  <tr>
                     <td>unpackaged</td>
                     <td>Simple</td>
                     <td>Optional</td>
                     <td><code>true</code> if the parcel is unpackaged (e.g., tires); defaults to <code>false</code>.</td>
                  </tr>
                  <tr>
                     <td>mailingTube</td>
                     <td>Simple</td>
                     <td>Optional</td>
                     <td><code>true</code> true indicates that the object will be shipped in a mailing tube; defaults to <code>false</code>.</td>
                  </tr>
                  <tr>
                     <td>oversized</td>
                     <td>Simple</td>
                     <td>Optional</td>
                     <td><code>true</code> true indicates that the object has oversized dimensions; automatically set correctly if dimensions are provided defaults to <code>false</code>.</td>
                  </tr>
                  <tr>
                     <td>
                        <p>services</p>
                     </td>
                     <td>
                        <p>simple</p>
                     </td>
                     <td>
                        <p>required</p>
                     </td>
                     <td>
                        <p>May occur   1 … 20 times.</p>
                        <p>Specifies the services to rate for this mailing scenario.</p>
                        <table cellspacing="0">
                           <thead>
                              <tr>
                                 <th class="center" style="width: 40%;">Code</th>
                                 <th class="center">Description</th>
                              </tr>
                           </thead>
                           <tbody>
                              <tr>
                                 <td>DOM.RP</td>
                                 <td>Regular Parcel</td>
                              </tr>
                              <tr>
                                 <td>DOM.EP</td>
                                 <td>Expedited Parcel</td>
                              </tr>
                              <tr>
                                 <td>DOM.EP.EPLUS</td>
                                 <td>Expedited Parcel Plus</td>
                              </tr>
                              <tr>
                                 <td>DOM.XP</td>
                                 <td>Xpresspost</td>
                              </tr>
                              <tr>
                                 <td>DOM.XP.CERT</td>
                                 <td>Xpresspost Certified</td>
                              </tr>
                              <tr>
                                 <td>DOM.PC</td>
                                 <td>Priority</td>
                              </tr>
                              <!--<tr>
                                 <td>DOM.DT</td>
                                 <td>Delivered Tonight</td>
                                 </tr>-->
                              <tr>
                                 <td>DOM.LIB</td>
                                 <td>Library Materials</td>
                              </tr>
                              <tr>
                                 <td>USA.EP</td>
                                 <td>Expedited Parcel USA</td>
                              </tr>
                              <tr>
                                 <td>USA.SP.AIR</td>
                                 <td>Small Packet USA Air</td>
                              </tr>
                              <tr>
                                 <td>USA.TP</td>
                                 <td>Tracked Packet – USA</td>
                              </tr>
                              <tr>
                                 <td>USA.XP</td>
                                 <td>Xpresspost USA</td>
                              </tr>
                              <tr>
                                 <td>INT.XP</td>
                                 <td>Xpresspost International</td>
                              </tr>
                              <tr>
                                 <td>INT.IP.AIR</td>
                                 <td>International Parcel Air</td>
                              </tr>
                              <tr>
                                 <td>INT.IP.SURF</td>
                                 <td>International Parcel Surface</td>
                              </tr>
                              <tr>
                                 <td>INT.SP.AIR</td>
                                 <td>Small Packet International Air</td>
                              </tr>
                              <tr>
                                 <td>INT.SP.SURF</td>
                                 <td>Small Packet International Surface</td>
                              </tr>
                              <tr>
                                 <td>INT.TP</td>
                                 <td>Tracked Packet – International</td>
                              </tr>
                           </tbody>
                        </table>
                     </td>
                  </tr>
                  <tr>
                     <td>
                        <p>originPostalCode</p>
                     </td>
                     <td>
                        <p>simple</p>
                     </td>
                     <td>
                        <p>required</p>
                     </td>
                     <td>
                        <p>Postal Code from which the parcel will be sent.<br />
                           Format ANANAN (only accepted with uppercase)
                        </p>
                     </td>
                  </tr>
                  <tr>
                     <td>
                        <p>destination</p>
                     </td>
                     <td>
                        <p>complex</p>
                     </td>
                     <td>
                        <p>required</p>
                     </td>
                     <td>
                        <p>Defines the destination of the parcel.</p>
                     </td>
                  </tr>
                  <tr>
                     <td>
                        <p>domestic</p>
                     </td>
                     <td>
                        <p>complex</p>
                     </td>
                     <td>
                        <p>choice</p>
                     </td>
                     <td>
                        <p>Defines the destination in Canada.</p>
                     </td>
                  </tr>
                  <tr>
                     <td>
                        <p>postalCode</p>
                     </td>
                     <td>
                        <p>simple</p>
                     </td>
                     <td>
                        <p>required</p>
                     </td>
                     <td>
                        <p>The destination Postal Code.</p>
                        <p>Format ANANAN (only accepted with uppercase)</p>
                     </td>
                  </tr>
                  <tr>
                     <td>
                        <p>unitedStates</p>
                     </td>
                     <td>
                        <p>complex</p>
                     </td>
                     <td>
                        <p>choice</p>
                     </td>
                     <td>
                        <p>Defines destination in the United States.</p>
                     </td>
                  </tr>
                  <tr>
                     <td>
                        <p>zipCode</p>
                     </td>
                     <td>
                        <p>simple</p>
                     </td>
                     <td>
                        <p>required</p>
                     </td>
                     <td>
                        <p>Used when country  code = US. Format is 5 digits or 5-4 (for extended Zip Codes)</p>
                        <p>E.g.  12345 or 12345-6789</p>
                     </td>
                  </tr>
                  <tr>
                     <td>
                        <p>international</p>
                     </td>
                     <td>
                        <p>complex</p>
                     </td>
                     <td>
                        <p>choice</p>
                     </td>
                     <td>
                        <p>Defines an international destination (destination other than the United States or Canada). Only one of international, us-destination or domestic can be specified.</p>
                     </td>
                  </tr>
                  <tr>
                     <td>
                        <p>countryCode</p>
                     </td>
                     <td>
                        <p>simple</p>
                     </td>
                     <td>
                        <p>required</p>
                     </td>
                     <td>
                        <p>The destination country code. Standard 2-character country code (valid country code other than CA or US)</p>
                     </td>
                  </tr>
                  <tr>
                     <td>
                        <p>postalCode</p>
                     </td>
                     <td>
                        <p>simple</p>
                     </td>
                     <td>
                        <p>optional</p>
